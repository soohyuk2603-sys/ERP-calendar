<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>가구매 진행 캘린더</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:1680px;min-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.title{font-size:25px;font-weight:800}.nav{display:flex;gap:8px;align-items:center}.nav button,.code-tools button{border:1px solid #d7dee8;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.month{font-size:18px;font-weight:700;min-width:120px;text-align:center}.code-tools{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:10px 12px;background:#fff;border:1px solid #dbe2ea;border-radius:10px}.code-tools .label{font-weight:800;margin-right:3px}.code-tools input{width:58px;padding:6px 7px;border:1px solid #cbd5e1;border-radius:7px;text-align:center;font-weight:700}.code-tools .range{color:#64748b;font-size:12px;margin-left:4px}.code-tools .open-codes{margin-left:auto;background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,minmax(165px,1fr));background:#dbe2ea;gap:1px;border:1px solid #dbe2ea}.dow,.day{background:#fff}.dow{padding:10px;text-align:center;font-weight:700;color:#64748b}.dow.weekend{color:#dc2626}.day{min-height:165px;padding:8px;position:relative}.day.other{background:#f8fafc;color:#a3acb8}.day.today{background:#fff7ed;box-shadow:inset 0 0 0 3px #f97316;z-index:1}.day.today .date{color:#c2410c}.today-badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:#f97316;color:#fff;font-size:10px;font-weight:800;vertical-align:1px}.date{font-weight:800;margin-bottom:4px}.date.weekend{color:#dc2626}.vendor-summary{display:flex;flex-wrap:wrap;gap:3px 6px;margin:0 0 6px;font-size:11px;color:#475569}.vendor-summary span{background:#f1f5f9;border-radius:999px;padding:2px 6px;font-weight:700}.event{border-left:4px solid #94a3b8;background:#f8fafc;border-radius:5px;padding:5px 7px;margin:4px 0;font-size:12px;line-height:1.35;overflow-wrap:anywhere}.event.에이블리{border-color:#60a5fa;background:#eff6ff}.event.카카오{border-color:#eab308;background:#fffbeb}.event.지그재그{border-color:#34d399;background:#ecfdf5}.ch{font-weight:800}.qty{font-weight:800}.mark{font-weight:800;color:#475569}.updated{font-size:12px;color:#64748b}.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:999;align-items:center;justify-content:center}.modal-bg.show{display:flex}.modal{width:min(520px,calc(100vw - 40px));max-height:78vh;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(15,23,42,.22);overflow:hidden}.modal-head{padding:16px 18px 10px;border-bottom:1px solid #e5e7eb}.modal-title{font-size:18px;font-weight:800}.modal-sub{margin-top:5px;font-size:12px;color:#64748b}.code-list{padding:12px 18px;max-height:52vh;overflow:auto;font-family:Consolas,monospace;font-size:14px;line-height:1.75;white-space:pre-wrap}.empty{font-family:Arial,'Noto Sans KR',sans-serif;color:#94a3b8}.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid #e5e7eb}.modal-actions button{border:1px solid #d7dee8;background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.modal-actions .copy{background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:800}@media(max-width:1180px){body{overflow-x:auto}.wrap{padding:10px}.day{min-height:140px}.event{font-size:11px}.title{font-size:20px}}
</style></head><body><div class='wrap'><div class='top'><div><div class='title'>가구매 진행 캘린더</div><div class='updated' id='updated'></div></div><div class='nav'><button onclick='move(-1)'>&lsaquo;</button><div class='month' id='month'></div><button onclick='move(1)'>&rsaquo;</button><button onclick='today()'>오늘</button></div></div><div class='code-tools'><span class='label'>상품코드 추출</span><span>과거</span><input id='pastDays' type='number' min='0' max='3650' value='30'><span>일 ~ 미래</span><input id='futureDays' type='number' min='0' max='3650' value='7'><span>일</span><span class='range' id='codeRange'></span><button class='open-codes' id='openCodes' onclick='openCodeModal()'>코드 보기/복사</button></div><div class='calendar' id='cal'></div></div><div class='modal-bg' id='codeModal' onclick='if(event.target===this)closeCodeModal()'><div class='modal'><div class='modal-head'><div class='modal-title' id='modalTitle'>가구매 쇼핑몰상품코드</div><div class='modal-sub' id='modalSub'></div></div><div class='code-list' id='codeList'></div><div class='modal-actions'><button onclick='closeCodeModal()'>닫기</button><button class='copy' id='copyCodes' onclick='copyCodes()'>전체 복사</button></div></div></div><script src='data.js'></script><script>
const data=window.CALENDAR_DATA||{events:[],code_items:[]};let view=new Date();view.setDate(1);const names=['일','월','화','수','목','금','토'];function fmt(n){return Number.isInteger(n)?n:n.toFixed(1)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function keyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseLocalDate(s){const [y,m,d]=String(s||'').split('-').map(Number);return y&&m&&d?new Date(y,m-1,d):null}function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}function safeDays(v,fallback){const n=parseInt(v,10);return Number.isFinite(n)?Math.max(0,Math.min(3650,n)):fallback}function codeSettings(){const p=safeDays(document.getElementById('pastDays').value,30),f=safeDays(document.getElementById('futureDays').value,7);return {past:p,future:f}}function codeWindow(){const s=codeSettings(),t=new Date(),today0=new Date(t.getFullYear(),t.getMonth(),t.getDate());return {from:addDays(today0,-s.past),to:addDays(today0,s.future),...s}}function filteredCodes(){const w=codeWindow(),set=new Set();(data.code_items||[]).forEach(x=>{const s=parseLocalDate(x.start_date),e=parseLocalDate(x.end_date),code=String(x.mall_product_code||'').trim();if(s&&e&&code&&e>=w.from&&s<=w.to)set.add(code)});return [...set].sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}))}function refreshCodeTool(){const w=codeWindow(),codes=filteredCodes();document.getElementById('pastDays').value=w.past;document.getElementById('futureDays').value=w.future;document.getElementById('codeRange').textContent=`${keyOf(w.from)} ~ ${keyOf(w.to)} · ${codes.length}개`;document.getElementById('openCodes').textContent=`코드 보기/복사 (${codes.length})`;try{localStorage.setItem('purchaseCodePastDays',String(w.past));localStorage.setItem('purchaseCodeFutureDays',String(w.future))}catch(e){}}function openCodeModal(){refreshCodeTool();const w=codeWindow(),codes=filteredCodes();document.getElementById('modalTitle').textContent=`가구매 쇼핑몰상품코드 · ${codes.length}개`;document.getElementById('modalSub').textContent=`기간 ${keyOf(w.from)} ~ ${keyOf(w.to)} · 중복 제거 · 중단/취소 제외`;document.getElementById('codeList').innerHTML=codes.length?codes.map(esc).join('<br>'):`<span class='empty'>해당 기간에 추출할 상품코드가 없습니다.</span>`;document.getElementById('copyCodes').disabled=!codes.length;document.getElementById('codeModal').classList.add('show')}function closeCodeModal(){document.getElementById('codeModal').classList.remove('show')}async function copyCodes(){const codes=filteredCodes();if(!codes.length)return;const txt=codes.join('\n');let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(_e){}ta.remove()}if(ok){const b=document.getElementById('copyCodes'),old=b.textContent;b.textContent='복사 완료';setTimeout(()=>b.textContent=old,1000)}}function initCodeTool(){let p=30,f=7;try{p=safeDays(localStorage.getItem('purchaseCodePastDays'),30);f=safeDays(localStorage.getItem('purchaseCodeFutureDays'),7)}catch(e){}document.getElementById('pastDays').value=p;document.getElementById('futureDays').value=f;['pastDays','futureDays'].forEach(id=>document.getElementById(id).addEventListener('input',refreshCodeTool));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCodeModal()});refreshCodeTool()}function render(){const y=view.getFullYear(),m=view.getMonth();document.getElementById('month').textContent=`${y}년 ${m+1}월`;document.getElementById('updated').textContent=`최근 갱신 ${data.updated_at||'-'}`;const cal=document.getElementById('cal');cal.innerHTML='';names.forEach((x,i)=>cal.insertAdjacentHTML('beforeend',`<div class='dow ${i===0||i===6?'weekend':''}'>${x}</div>`));const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),todayKey=keyOf(new Date());for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=keyOf(d);const ev=data.events.filter(x=>x.date===key),total=ev.reduce((a,x)=>a+Number(x.quantity||0),0);const groups={},vendors={};ev.forEach(x=>{(groups[x.channel]||(groups[x.channel]=[])).push(x);const va=x.vendor_abbr||x.vendor||'미지정';vendors[va]=(vendors[va]||0)+Number(x.quantity||0)});const box=document.createElement('div');box.className='day'+(d.getMonth()!==m?' other':'')+(key===todayKey?' today':'');const weekend=d.getDay()===0||d.getDay()===6;let html=`<div class='date ${weekend?'weekend':''}'>${d.getMonth()+1}/${d.getDate()}${key===todayKey?`<span class='today-badge'>오늘</span>`:''}${total?` <span class='qty'>총 ${fmt(total)}개</span>`:''}</div>`;if(Object.keys(vendors).length){html+=`<div class='vendor-summary'>${Object.entries(vendors).map(([v,q])=>`<span>${esc(v)} ${fmt(q)}개</span>`).join('')}</div>`}for(const [ch,items] of Object.entries(groups)){html+=`<div class='event ${ch}'><span class='ch'>${esc(ch)}</span>${items.map(x=>`<div>${esc(x.name)} - <span class='qty'>${fmt(x.quantity)}개</span>${x.vendor_mark?` <span class='mark'>(${esc(x.vendor_mark)})</span>`:''}</div>`).join('')}</div>`}box.innerHTML=html;cal.appendChild(box)}}function move(n){view.setMonth(view.getMonth()+n);render()}function today(){view=new Date();view.setDate(1);render()}initCodeTool();render();
</script></body></html>
